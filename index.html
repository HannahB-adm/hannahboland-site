<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hannah Boland | New things are coming</title>
  <meta name="description" content="New things are coming. Watch this space.">
  <style>
    :root {
      --bg: #faf7f2;
      --ink: #22201d;
      --muted: #6f6a63;
      --accent: #b4532a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171614;
        --ink: #f3efe8;
        --muted: #a8a299;
        --accent: #e58a5c;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      text-align: center;
    }
    main { max-width: 640px; width: 100%; }
    .graphic {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto 40px;
    }
    .name {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 24px;
    }
    h1 {
      font-size: clamp(2.2rem, 8vw, 4rem);
      font-weight: 400;
      line-height: 1.1;
      margin: 0 0 20px;
      text-wrap: balance;
    }
    .sub {
      font-size: 1.2rem;
      font-style: italic;
      color: var(--muted);
      margin: 0;
    }
  </style>
</head>
<body>
  <main>
    <!-- Graphic goes here: save it as graphic.png beside this file, then uncomment the next line -->
    <!-- <img class="graphic" src="graphic.png" alt=""> -->
    <p class="name">Hannah Boland</p>
    <h1>New things are coming.</h1>
    <p class="sub">Watch this space.</p>
  </main>
</body>
</html>
