<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hannah Boland | New things coming soon</title>
  <meta name="description" content="New things coming soon.">
  <meta name="theme-color" content="#111111">
  <link rel="preload" as="image" href="peek.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #111;
      color: #fff;
      font-family: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    main {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }
    /* The face sits at roughly 66% across / 37% down the image, so anchoring
       the crop there keeps it in view at every screen shape. */
    .graphic {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 66% 37%;
    }
    h1 {
      position: absolute;
      margin: 0;
      font-weight: 300;
      line-height: 1.05;
      letter-spacing: -0.01em;
      text-wrap: balance;
      /* Wide screens: text sits in the black space left of the tear */
      left: 7vw;
      top: 50%;
      transform: translateY(-50%);
      max-width: 42vw;
      font-size: clamp(1rem, 2.8vw, 3rem);
    }
    /* Tall screens (phones, portrait tablets): text sits below the tear */
    @media (orientation: portrait) {
      h1 {
        left: 0;
        right: 0;
        top: 60%;
        transform: none;
        max-width: none;
        padding: 0 24px;
        text-align: center;
        font-size: clamp(1.1rem, 5.5vw, 2.5rem);
      }
    }
  </style>
</head>
<body>
  <main>
    <img class="graphic" src="peek.webp" alt="Hannah peeking through a tear in black paper">
    <h1>New things coming soon.</h1>
  </main>
</body>
</html>
